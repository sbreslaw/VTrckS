specVersion: "4.0"
metadata:
  name: cdc.vaccreq
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://sapapp2dh1.cdc.gov:44300
            client: "100"
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: cdc.vaccreq
        ui5Theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
