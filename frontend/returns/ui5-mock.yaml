specVersion: "4.0"
metadata:
  name: cdc.vaccret
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        backend:
          - path: /sap
            url: https://sapapp2dh1.cdc.gov:44300
          - path: /resources
            url: https://sapapp2dh1.cdc.gov:44300/sap/public/bc/ui5_ui5
          - path: /test-resources
            url: https://sapapp2dh1.cdc.gov:44300/sap/public/bc/ui5_ui5
    - name: sap-fe-mockserver
      beforeMiddleware: fiori-tools-proxy
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata4/sap/ui_customerreturnmanage/srvd/sap/ui_customerreturnmanage/0001
            metadataPath: ./webapp/localService/metadata.xml
            mockdataPath: ./webapp/localService/mockdata
            generateMockData: true
            annotations: []
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: cdc.vaccret
        ui5Theme: sap_horizon
