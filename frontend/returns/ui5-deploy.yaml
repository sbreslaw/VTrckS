specVersion: "4.0"
metadata:
  name: cdc.vaccret
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        strictSsl: false
        ignoreCertErrors: true
        log: 5
        target:
          url: https://sapapp2dh1.cdc.gov:44300
          client: "100"
          auth: basic
        credentials:
          username: env:UI5_USERNAME
          password: env:UI5_PASSWORD
        app:
          # TODO-VERIFY: proposed name/transport, not yet confirmed by basis
          # (see prompt §0 and OPEN_QUESTIONS.md) - deployment is not part of
          # MVP-1's Definition of Done, this file only prepares `npm run deploy`
          # for once the transport exists.
          name: ZCDC_VTRCKS_RET
          description: CDC Manage Returns
          package: ZCM
          transport: DH1K900363
        exclude:
          - /test/
          - /localService/
