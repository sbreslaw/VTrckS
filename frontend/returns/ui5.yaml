specVersion: "4.0"
metadata:
  name: cdc.vaccret
type: application
framework:
  name: SAPUI5
  version: 1.136.0
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.f
    - name: sap.ui.layout
    - name: sap.ui.comp
    - name: sap.ui.unified
    - name: sap.ui.table
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true
        backend:
          - path: /sap
            url: https://sapapp2dh1.cdc.gov:44300
          - path: /resources
            url: https://sapapp2dh1.cdc.gov:44300/sap/public/bc/ui5_ui5
    - name: sap-fe-mockserver
      beforeMiddleware: fiori-tools-proxy
      configuration:
        service:
          urlBasePath: /sap/opu/odata4/sap/ui_customerreturnmanage/srvd/sap/ui_customerreturnmanage/0001
          name: ""
          metadataXmlPath: ./webapp/localService/metadata.xml
          mockdataRootPath: ./webapp/localService/mockdata
          generateMockData: true
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: cdc.vaccret
        ui5Theme: sap_horizon
